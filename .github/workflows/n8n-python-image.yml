name: Build and publish n8n with Python

on:
  push:
    branches: [main]
    paths:
      - "n8n-python/**"
      - ".github/workflows/n8n-python-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set lowercase image owner
        id: image
        run: echo "owner=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./n8n-python
          push: true
          tags: |
            ghcr.io/${{ steps.image.outputs.owner }}/n8n-python:2.46.6
            ghcr.io/${{ steps.image.outputs.owner }}/n8n-python:latest
